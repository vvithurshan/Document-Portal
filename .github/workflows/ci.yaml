# .github/workflows/ci.yml
name: Run Unit Tests

on: [push, pull_request] # when pushing and pulling, it will run


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo # clone the repo to the github action
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest

      - name: Run unit tests
        run: |
          pytest tests/